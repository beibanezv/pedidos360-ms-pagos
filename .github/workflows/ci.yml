name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pedidos360
          POSTGRES_PASSWORD: pedidos360
          POSTGRES_DB: pedidos360_pagos_test
        ports:
          - 5439:5432
        options: --health-cmd "pg_isready -U pedidos360 -d pedidos360_pagos_test" --health-interval 5s --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
        env:
          P360_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5439/pedidos360_pagos_test
