spring.application.name=ms-pagos
server.port=${PORT:8089}
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5439/pedidos360_pagos}
spring.datasource.username=${DATASOURCE_USER:pedidos360}
spring.datasource.password=${DATASOURCE_PASSWORD:pedidos360}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.rabbitmq.publisher-confirm-type=correlated

# Webpay Plus (modo integracion: sin secretos, codigos oficiales de prueba)
webpay.commerce-code=${WEBPAY_COMMERCE_CODE:597055555532}
webpay.api-key=${WEBPAY_API_KEY:}
webpay.return-url=${WEBPAY_RETURN_URL:http://localhost:8089/pagos/webpay/retorno}
webpay.frontend-url=${FRONTEND_ORIGIN:http://localhost:4200}
